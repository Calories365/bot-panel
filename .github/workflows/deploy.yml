name: Deploy bot-panel (host-runner)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Git pull → /var/www/bot-panel/src
        run: |
          set -euo pipefail
          cd /home/maxim/var/www/bot-panel/src
          git fetch origin main
          git reset --hard origin/main

      - name: Docker compose up --build (recreate)
        working-directory: /home/maxim/var/www/bot-panel
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          # A plain build reuses whatever base images the server has cached: nginx 1.27.3
          # from 2024 survived until 23.11.2026. Pull the service images (mysql, redis,
          # meilisearch) and the base images (php, node, nginx) before building.
          docker compose pull --ignore-buildable
          docker compose build --pull
          docker compose up -d --force-recreate --remove-orphans
          docker builder prune --filter "until=168h" --force

      - name: Laravel migrate --force
        working-directory: /home/maxim/var/www/bot-panel
        run: |
          set -euo pipefail
          docker compose exec -T bot_panel_php php artisan migrate --force --no-interaction

      - name: Graceful restart Horizon
        working-directory: /home/maxim/var/www/bot-panel
        run: |
          set -euo pipefail
          docker compose exec -T bot_panel_horizon php artisan optimize:clear
          docker compose exec -T bot_panel_horizon php artisan horizon:terminate
